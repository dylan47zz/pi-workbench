[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pi-workbench"
dynamic = ["version"]
description = "A Pi-agent personal workbench over an Obsidian-compatible knowledge vault."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dylan" }]
keywords = [
  "pi-agent",
  "personal-workbench",
  "obsidian",
  "knowledge-management",
  "markdown",
  "personal-productivity",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/dylan47zz/pi-workbench"
Repository = "https://github.com/dylan47zz/pi-workbench"
Issues = "https://github.com/dylan47zz/pi-workbench/issues"

[project.scripts]
pi-workbench = "pi_workbench.cli:main"

# Version remains CalVer-derived from Git tags while the project is pre-release.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["pi_workbench"]
exclude = [
  "**/__pycache__",
  "**/*.py[co]",
]

[tool.hatch.build.targets.wheel.force-include]
".skills/workbench-capture" = "pi_workbench/_data/skills/workbench-capture"
".skills/workbench-context" = "pi_workbench/_data/skills/workbench-context"
".skills/workbench-dashboard" = "pi_workbench/_data/skills/workbench-dashboard"
".skills/workbench-graph" = "pi_workbench/_data/skills/workbench-graph"
".skills/workbench-history" = "pi_workbench/_data/skills/workbench-history"
".skills/workbench-lint" = "pi_workbench/_data/skills/workbench-lint"
".skills/workbench-output" = "pi_workbench/_data/skills/workbench-output"
".skills/workbench-project" = "pi_workbench/_data/skills/workbench-project"
".skills/workbench-query" = "pi_workbench/_data/skills/workbench-query"
".skills/workbench-review" = "pi_workbench/_data/skills/workbench-review"
".skills/workbench-status" = "pi_workbench/_data/skills/workbench-status"
".skills/workbench-subscriptions" = "pi_workbench/_data/skills/workbench-subscriptions"
".skills/workbench-triage" = "pi_workbench/_data/skills/workbench-triage"

[tool.hatch.build.targets.sdist]
exclude = [
  "/.claude",
  "/.cursor/skills",
  "/.windsurf/skills",
  "/.agents/skills",
  "/.pi/skills",
  "/.kiro/skills",
  "/dist",
  "/build",
]

[tool.hatch.build.targets.sdist.force-include]
".skills/workbench-capture" = ".skills/workbench-capture"
".skills/workbench-context" = ".skills/workbench-context"
".skills/workbench-dashboard" = ".skills/workbench-dashboard"
".skills/workbench-graph" = ".skills/workbench-graph"
".skills/workbench-history" = ".skills/workbench-history"
".skills/workbench-lint" = ".skills/workbench-lint"
".skills/workbench-output" = ".skills/workbench-output"
".skills/workbench-project" = ".skills/workbench-project"
".skills/workbench-query" = ".skills/workbench-query"
".skills/workbench-review" = ".skills/workbench-review"
".skills/workbench-status" = ".skills/workbench-status"
".skills/workbench-subscriptions" = ".skills/workbench-subscriptions"
".skills/workbench-triage" = ".skills/workbench-triage"
